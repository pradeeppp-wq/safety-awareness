<style>
*{
    margin: 0;
    padding: 0;
    font-family: 'Noto Sans', sans-serif;
    color: #000;
}
/*header*/

title {
  background-color: black;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: space-around;
}

.header {
  display: flex;
  justify-content: space-between;
}

/* label */

.button {
  display: flex;
  justify-content: space-around;
  height: 38px;
  overflow-y: hidden;
  outline-width: none;
  text-align: center;
  cursor: pointer;
  scrollbar-width: none;

  background-color: yellow;
 
}


.button a:link, a:visited {  
  
  text-align: center;

  text-decoration: none;
  display: flex;
  
  background-color: #04AA6A;
    
    font-family: 'Source Sans Pro', sans-serif;

  
    

    display: flex;
  justify-content: space-around;
  align-items: center;
  height: 30px;
  width: 150px;
  color: yellow;
  background-color: black;
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  margin: 4px 2px;
  font-weight: bold;
 
    
}

/* floating side button */

.floating-container {
    position: fixed;
    bottom: 15px;
    right: 15px;
    z-index: 9999;
}

/* Apply directly to the button/link */
.floating-container{
  background-color: blue;
    display: flex;
    align-items: center;
    justify-content: center;

    width: 32px;      /* Equal width */
    height: 32px;     /* Equal height */
    border-radius: 50%; /* Makes it a perfect circle */
    text-decoration: none;
    
    cursor: pointer;

    transition: background-color 0.3s;
}

.floating-container:hover {
    background-color: yellowgreen;
}





/* Video */
 video {
    width: 100%;
    height: 100vh; /* vh = viewport height */
  }
  
  video {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Key property for resizing */
  }

  main {
    width: 100%;
    height: 100vh; /* vh = viewport height */
  }
  
  main {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Key property for resizing */
  }


</style>
